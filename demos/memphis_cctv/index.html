<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "NotoSC"; src: url("../../assets/fonts/NotoSansSC.ttf"); }
html, body { margin: 0; background: #FFF6E5; }
canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="scene.js"></script>
<script>
const ctx = document.getElementById('c').getContext('2d');
window.render = async (i) => { frame(i, ctx); return true; };
window.ready = (async () => { await document.fonts.load('800 34px "NotoSC"'); await document.fonts.load('500 24px "NotoSC"'); frame(0, ctx); return true; })();
</script></body></html>
