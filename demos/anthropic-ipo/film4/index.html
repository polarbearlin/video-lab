<!doctype html>

<body>
<div id="stage" class="L" style="width:1920px;height:1080px;overflow:hidden"></div>
<script>
// 约定：window.render(t) 只依赖 t；随机数有种子；READY 之前图片和字体都加载好。组件 = COMP[名字](根节点, 参数, 镜头时长) → draw(u)，u 是镜头内的相对时间。
const W = 1920, H = 1080;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k;
const eOut = x => 1 - Math.pow(1 - clamp(x), 3);
const eInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eBack = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const seg = (u, a, d) => clamp((u - a) / d);

const css = (e, s) => { e.style.cssText += ';' + s; return e; };
const set = (e, o, tf) => { e.style.opacity = o; if (tf != null) e.style.transform = tf; };
const pop = (e, u, a, base = '', from = .6) => set(e, clamp((u - a) * 6), `${base} scale(${lerp(from, 1, eBack(seg(u, a, .45)))})`);
const slam = (e, u, a, rot = -5, from = 2.3) => { const s = seg(u, a, .2); set(e, s > 0 ? 1 : 0, `rotate(${rot}deg) scale(${lerp(from, 1, eOut(s))})`); };
const IMG = {};
let DUR = 0;

function ground() {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); const r = rng(7);
  g.fillStyle = '#0D0A09'; g.fillRect(0, 0, W, H);
  for (const [x0, w, a] of [[-300, 520, .55], [380, 260, .35], [1250, 640, .45]]) { const gr = g.createLinearGradient(x0, 0, x0 + w + 900, H); gr.addColorStop(0, `rgba(170,28,18,${a})`); gr.addColorStop(1, 'rgba(60,8,6,0)'); g.fillStyle = gr; g.beginPath(); g.moveTo(x0, 0); g.lineTo(x0 + w, 0); g.lineTo(x0 + w + 900, H); g.lineTo(x0 + 900, H); g.closePath(); g.fill(); }
  g.strokeStyle = 'rgba(255,240,220,.045)'; for (let x = 0; x < W; x += 48) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, H); g.stroke(); } for (let y = 0; y < H; y += 48) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(W, y + .5); g.stroke(); }
  const id = g.getImageData(0, 0, W, H); for (let i = 0; i < id.data.length; i += 4) { const n = (r() - .5) * 22; id.data[i] += n; id.data[i + 1] += n; id.data[i + 2] += n; } g.putImageData(id, 0, 0);
  const v = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.7)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
  return c.toDataURL('image/jpeg', .92);
}
function grain() { const out = []; for (let k = 0; k < 8; k++) { const c = document.createElement('canvas'); c.width = 960; c.height = 540; const g = c.getContext('2d'); const id = g.createImageData(960, 540); const r = rng(100 + k); for (let i = 0; i < id.data.length; i += 4) { const n = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = n; id.data[i + 3] = 26; } g.putImageData(id, 0, 0); out.push(c.toDataURL()); } return out; }
const bgImg = r => { const i = el('img', 'L', null, r); i.src = IMG.ground; return i; };
const canvas = (r, w = W, h = H) => { const c = el('canvas', 'L', null, r); c.width = w; c.height = h; return c; };

// ---------- 组件 ----------
const COMP = {
  // 纸片标签：tl 左上 / bl 左下
  tag(r, p) { const t = css(el('div', 'tag' + (p.small ? ' small' : ''), p.html, r), p.pos === 'bl' ? 'left:96px;bottom:80px' : 'left:70px;top:70px');
    return u => set(t, eOut(seg(u, .15, .25)), `rotate(${p.pos === 'bl' ? -1.2 : 0}deg) translateX(${(1 - eBack(seg(u, .15, .45))) * -70}px)`); },
  // 引语条（打字）
  quote(r, p) { const q = css(el('div', 'tag', '', r), 'left:96px;bottom:110px;font:900 64px Serif;background:#7E1A10;color:#F2E6CE;padding:18px 40px 22px');
    const s = p.src ? css(el('div', 'tag small', p.src, r), 'left:96px;bottom:40px;font-size:28px') : null;
    return u => { const n = Math.round(p.text.length * clamp((u - .25) / Math.min(1.4, p.text.length * .07))); q.textContent = p.text.slice(0, Math.max(1, n)); set(q, u > .2 ? 1 : 0, `translateX(${(1 - eOut(seg(u, .2, .3))) * -40}px)`); if (s) set(s, eOut(seg(u, .6, .3))); }; },
  // 大数字滚动 + 说明条
  counter(r, p) { const n = css(el('div', 'big', '', r), 'left:0;right:0;text-align:center;top:290px;font-size:250px;color:#F3B35A;text-shadow:0 0 60px rgba(255,160,40,.5),0 8px 0 #2A120A');
    const s = css(el('div', 'tag', p.sub, r), 'left:50%;top:620px');
    return u => { const k = eOut(seg(u, 0, Math.min(1.0, DUR_SHOT(r) * .5))); const v = p.fmt === 'int' ? Math.max(k > .02 ? 1 : 0, Math.round(p.value * k)) : Math.round(p.value * k);
      n.innerHTML = `${v.toLocaleString()}<span class="serif" style="font-size:120px">${p.unit}</span>`; set(s, eOut(seg(u, .5, .3)), `translateX(-50%) translateY(${(1 - eOut(seg(u, .5, .3))) * 30}px)`); }; },
  // 片名：价格线 + 盖章
  title_ipo(r) { const l1 = css(el('div', 'big', '<span style="font-family:Oswald;font-weight:500">11/19</span> <span class="serif">上市</span>', r), 'left:170px;top:250px;font-size:120px');
    const cv = canvas(r), st = css(el('div', 'stamp', '11/24 破发', r), 'left:1040px;top:600px;font-size:120px');
    return u => { set(l1, eOut(seg(u, 0, .25)), `translateY(${(1 - eOut(seg(u, 0, .35))) * 40}px)`); const g = cv.getContext('2d'); g.clearRect(0, 0, W, H);
      const k = eInOut(seg(u, .15, .75)), pts = [[180, 520], [560, 470], [900, 600], [1240, 640], [1620, 760]];
      g.setLineDash([22, 16]); g.strokeStyle = 'rgba(214,49,30,.9)'; g.lineWidth = 5; g.beginPath(); g.moveTo(150, 690); g.lineTo(150 + 1650 * clamp(k * 1.3), 690); g.stroke(); g.setLineDash([]);

      const s = seg(u, .85, .18), sh = s > 0 && s < 1 ? Math.sin(u * 90) * 10 * (1 - s) : 0; set(st, s > 0 ? 1 : 0, `translate(${sh}px,${sh * .6}px) rotate(-6deg) scale(${lerp(2.2, 1, eOut(s))})`); }; },
  // 画布：两张照片卡，镜头从第一张横移到第二张，盖章，再拉远
  compare_cards(r, p) { const world = css(el('div', 'L', null, r), 'width:3600px;height:1600px;transform-origin:0 0');
    const mk = (x, y, rot, c) => css(el('div', 'card', `<img src="${c[0]}"><div class="cap"><span>${c[1]}</span><i>${c[2]}</i></div>`, world), `left:${x}px;top:${y}px;width:900px;transform:rotate(${rot}deg)`);
    const c1 = mk(300, 360, -3, p.cards[0]), c2 = mk(2080, 300, 2.5, p.cards[1]), ar = canvas(world, 3600, 1600);
    const st = css(el('div', 'stamp', p.stamp, world), 'left:2240px;top:1060px;font-size:110px'), rec = css(el('div', 'tag', `<span class="k">RECORD</span>${p.first}`, world), 'left:330px;top:250px;font-size:40px');
    return u => { const d = DUR_SHOT(r), p1 = eInOut(seg(u, d * .19, d * .3)), p2 = eInOut(seg(u, d * .69, d * .23));
      const cx = lerp(lerp(750, 2530, p1), 1720, p2), cy = lerp(800, 860, p2), z = lerp(lerp(1.35, 1.25, p1), .58, p2);
      world.style.transform = `translate(${W / 2 - cx * z}px,${H / 2 - cy * z}px) scale(${z})`;
      set(c1, 1, `rotate(-3deg) translateY(${(1 - eOut(seg(u, 0, .4))) * 60}px)`); c1.style.filter = `brightness(${lerp(1, .55, p1)})`;
      set(c2, eOut(seg(u, d * .27, .3)), `rotate(2.5deg) scale(${lerp(.85, 1, eBack(seg(u, d * .27, .5)))})`); pop(rec, u, .3, 'rotate(-4deg)');
      const g = ar.getContext('2d'); g.clearRect(0, 0, 3600, 1600); const k = eInOut(seg(u, d * .21, d * .17));
      if (k > 0) { g.strokeStyle = '#E07A3F'; g.lineWidth = 12; g.setLineDash([30, 20]); g.beginPath(); g.moveTo(1240, 760); g.quadraticCurveTo(1650, 520, lerp(1240, 2040, k), lerp(760, 720, k)); g.stroke(); }
      slam(st, u, d * .56); }; },
  // 插画上叠价格线
  price_overlay(r, p) { const cv = canvas(r), st = css(el('div', 'stamp', p.stamp, r), 'left:1180px;top:120px;font-size:88px');
    return u => { const g = cv.getContext('2d'); g.clearRect(0, 0, W, H); priceLine(g, u, 260, 330, 980, 560); slam(st, u, 1.95, 6); }; },
  price_full(r) { const cv = canvas(r), t = css(el('div', 'big serif', 'Anthropic 上市头四个交易日', r), 'left:96px;top:60px;font-size:72px'), st = css(el('div', 'stamp', '跌破发行价', r), 'left:1240px;top:70px;font-size:80px');
    const O = [[111.5, 115.1, 92.72, 97.17], [89.86, 92.56, 83.05, 88.91], [93.65, 94.24, 84.61, 87.64], [83.4, 83.49, 75.61, 81.91]], D = ['11/19', '11/20', '11/23', '11/24'];
    return u => { const g = cv.getContext('2d'); g.clearRect(0, 0, W, H); set(t, eOut(seg(u, 0, .3)));
      const Y = v => 950 - (v - 70) / 50 * 700, X = i => 420 + i * 330;
      g.strokeStyle = 'rgba(255,240,220,.08)'; g.lineWidth = 2; g.font = '500 34px Oswald'; g.fillStyle = 'rgba(240,230,210,.55)';
      for (const v of [80, 90, 100, 110]) { g.beginPath(); g.moveTo(300, Y(v)); g.lineTo(1650, Y(v)); g.stroke(); g.fillText(v, 240, Y(v) + 12); }
      g.setLineDash([22, 16]); g.strokeStyle = '#E8341F'; g.lineWidth = 5; g.beginPath(); g.moveTo(300, Y(83)); g.lineTo(300 + 1350 * eOut(seg(u, .1, .6)), Y(83)); g.stroke(); g.setLineDash([]);
      g.fillStyle = '#E8341F'; g.font = '500 40px Oswald'; g.fillText('$83 发行价', 1680, Y(83) + 14);
      O.forEach(([o, h, l, c], i) => { const k = eOut(seg(u, .5 + i * .35, .35)); if (k <= 0) return; const m = (o + c) / 2, col = c >= o ? '#E8341F' : '#2FBF6E';
        g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 7; g.beginPath(); g.moveTo(X(i), Y(m + (h - m) * k)); g.lineTo(X(i), Y(m + (l - m) * k)); g.stroke();
        g.fillRect(X(i) - 60, Y(m + (Math.max(o, c) - m) * k), 120, Math.max(4, (Y(m + (Math.min(o, c) - m) * k) - Y(m + (Math.max(o, c) - m) * k))));
        g.fillStyle = 'rgba(240,230,210,.75)'; g.font = '500 36px Oswald'; g.fillText(D[i], X(i) - 42, 1010); });
      if (u > 1.9) { g.fillStyle = '#2FBF6E'; g.font = '500 50px Oswald'; g.fillText('收 81.91', X(3) - 90, Y(75.61) + 64); g.fillStyle = '#F2E6CE'; g.fillText('最高 115.10', X(0) + 80, Y(115.1) + 14); }
      slam(st, u, 2.1, 5); }; },
  // 文档：倾斜纸页 → 推到高亮行 → 荧光笔 → 中文贴条（可选第二处、照片落下）
  doc(r, p) { const cam = css(el('div', 'L', null, r), 'width:1920px;height:1080px;perspective:2200px');
    const page = css(el('div', 'L', null, cam), `width:${p.w}px;box-shadow:0 40px 80px rgba(0,0,0,.7);background:#fff`); const im = css(el('img', null, null, page), `display:block;width:${p.w}px;filter:sepia(.15) contrast(1.04)`); im.src = p.img;
    const mkh = list => list.map(([x, y, w, h]) => css(el('div', 'L', null, page), `left:${x}px;top:${y}px;height:${h + 10}px;margin-top:-5px;background:rgba(232,110,40,.6);mix-blend-mode:multiply;border-radius:6px`));
    const H1 = mkh(p.hl), H2 = mkh(p.hl2 || []), lens = list => list.map(x => x[2]);
    const tr = css(el('div', 'tag', p.tr, page), `left:20px;top:${p.tr_y}px;font-size:44px;background:#F7EEDB`), tr2 = p.tr2 ? css(el('div', 'tag', p.tr2, page), `left:20px;top:${p.tr2_y}px;font-size:44px;background:#F7EEDB`) : null;
    const ph = p.photo ? css(el('div', 'card', `<img src="${p.photo[0]}"><div class="cap"><span>${p.photo[1]}</span><i>${p.photo[2]}</i></div>`, r), 'left:1080px;top:300px;width:700px') : null;
    const sr = css(el('div', 'src', p.src, r), '');
    const f1 = p.focus || [p.hl[0][0] + p.hl[0][2] / 2, p.hl[0][1]], f2 = p.focus2 || f1;
    return u => { const d = DUR_SHOT(r), z = eInOut(seg(u, 0, 1.0)), mid = p.hl2 ? eInOut(seg(u, d * .5, .9)) : 0, out = ph ? eInOut(seg(u, d - 1.1, .6)) : 0;
      const fx = lerp(f1[0], f2[0], mid), fy = lerp(f1[1], f2[1], mid), sc = lerp(.85, 1.4, z) * lerp(1, .8, out);

      H1.forEach((h, i) => h.style.width = `${lens(p.hl)[i] * eOut(seg(u, .6 + i * .35, .5))}px`); H2.forEach((h, i) => h.style.width = `${lens(p.hl2)[i] * eOut(seg(u, d * .5 + .7 + i * .35, .5))}px`);
      pop(tr, u, 1.15 + .35 * (p.hl.length - 1), 'rotate(-1.5deg)', .8); if (tr2) pop(tr2, u, d * .5 + 1.2, 'rotate(-1.5deg)', .8);
      if (ph) { const dd = seg(u, d - 1.0, .45); set(ph, dd > 0 ? 1 : 0, `translateY(${(1 - eBack(dd)) * -700}px) rotate(${lerp(-14, 4, eOut(dd))}deg)`); }
      set(sr, eOut(seg(u, .3, .3))); }; },
  letters(r, p) { const w = css(el('div', 'big', '', r), `left:0;right:0;text-align:center;top:${p.spread ? 330 : 410}px;font:400 ${p.spread ? 260 : 150}px Display;letter-spacing:${p.spread ? 120 : 38}px;color:${p.spread ? '#E07A3F' : '#F2E6CE'}`);

  stamp_only(r, p) { const st = css(el('div', 'stamp', p.text, r), `left:1150px;top:150px;font-family:Serif${p.light ? ';color:#F2E6CE;border-color:#F2E6CE' : ''}`); return u => slam(st, u, p.at || .5, -4, 2.2); },
  headline(r, p) { const w = css(el('div', 'big', p.html, r), `left:0;right:0;text-align:center;top:${p.center ? 420 : 780}px;font:900 ${p.center ? 150 : 120}px Serif`);
    return u => { const k = eOut(seg(u, p.center ? .05 : .4, .5)); set(w, k, `scale(${lerp(1.15, 1, k)})`); w.style.letterSpacing = `${lerp(40, 6, k)}px`; }; },
  // 纸面柱状：两根柱从下往上长，数字滚动
  bars(r, p) { const pp = css(el('div', 'paper', '', r), 'left:200px;top:110px;width:1520px;height:860px;transform:rotate(-1deg)');
    const t = css(el('div', 'L', p.title, pp), 'left:60px;top:40px;font:900 72px Serif'), note = css(el('div', 'stamp', p.note, pp), 'left:60px;top:170px;font-size:56px'), src = css(el('div', 'L', p.src, pp), 'left:60px;top:790px;font:700 30px Sans;color:#6A5A48');
